# Standalone pytest config for the browser tier.
#
# This tier lives OUTSIDE tests/ on purpose. `tests/conftest.py` runs a
# `pytest_configure` safety guard that hard-exits unless SAM_TEST_DB_URL points
# at an allowlisted (host, port) — the dedicated mysql-test container. Browser
# tests talk HTTP and never touch the DB, and conftest.py files are only loaded
# from a test file's ancestor directories, so `e2e/` being a sibling of
# `tests/` means the guard is never loaded and never has to be weakened.
#
# The config must be separate too: running `pytest e2e/` from the repo root
# would otherwise inherit the root pytest.ini's
# `addopts = -v --strict-markers --tb=short --maxfail=5 -n auto -m "not perf"`.
# `-n auto` hard-errors when xdist isn't installed on the runner, and the perf
# marker doesn't exist here.
#
# Run it via the Makefile so CI and local use one invocation:
#   make e2e                                        # -> http://localhost:7050
#   make e2e SAM_E2E_BASE_URL=http://localhost:5050 # -> dev server
#
# Nothing under e2e/ may import sam / webapp / system_status. That is what lets
# CI install a bare Python + pytest-playwright instead of building a conda env.

[pytest]
testpaths = .
python_files = test_*.py
python_functions = test_*

addopts =
    -v
    --strict-markers
    --tb=short

# Deliberately absent, and not to be added without reading the flake budget in
# docs/plans/FRONTEND_TEST_NET.md:
#   --retries / --reruns : a flaky sweep route gets FIXED or DELETED, never
#                          retried. Retries turn a real intermittent bug into
#                          invisible noise.
#   -n auto              : the sweep is a handful of browser tabs; parallelism
#                          buys little and multiplies rate-limit pressure
#                          against a single authenticated actor.

# Per-test ceiling. A hung page load should fail the test, not the job.
timeout = 120
