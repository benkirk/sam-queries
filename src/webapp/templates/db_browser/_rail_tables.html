{# Table list. Context: src, entries (TableEntry), current (table name or none). #}
<div class="list-group list-group-flush db-table-list">
    {% for e in entries %}
    <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center gap-2 py-1{% if e.name == current %} active{% endif %}"
       href="{{ url_for('db_browser.table', source=src.key, table=e.name) }}"
       {% if e.name == current %}aria-current="page"{% endif %}>
        <span class="text-truncate font-monospace small">{{ e.name }}</span>
        <span class="small text-nowrap db-estimate">
            {%- if e.kind == 'view' %}view{% elif e.estimate is not none %}~{{ e.estimate | fmt_number }}{% endif -%}
        </span>
    </a>
    {% else %}
    <div class="small text-body-secondary p-2">No tables match.</div>
    {% endfor %}
</div>
