{% extends 'dashboards/admin/base_admin.html' %}

{% block title %}Admin: Configuration - SAM{% endblock %}

{% block admin_content %}
<div class="card">
    <div class="card-header">
        <h5 class="mb-0">
            <i class="fas fa-sliders-h"></i> Configuration
            <small class="text-muted fw-normal ms-2">Read-only system snapshot</small>
        </h5>
    </div>
    <div id="configurationSection"
         hx-get="{{ url_for('admin_dashboard.htmx_configuration_card') }}"
         hx-trigger="load once"
         hx-swap="innerHTML">
        <div class="card-body text-center text-muted py-4" role="status">
            <i class="fas fa-spinner fa-spin fa-2x" aria-hidden="true"></i>
            <p class="mt-2">Loading...</p>
        </div>
    </div>
</div>
{% endblock %}
