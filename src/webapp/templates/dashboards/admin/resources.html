{% extends 'dashboards/admin/base_admin.html' %}

{% block title %}Admin: Resources - SAM{% endblock %}

{% block admin_content %}
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0 flex-grow-1">
            <i class="fas fa-server"></i> Resources
        </h5>
        <div class="form-check form-switch ms-3 mb-0">
            <input class="form-check-input" type="checkbox" id="resourcesCardActiveOnly"
                   name="active_only" value="1" checked
                   hx-get="{{ url_for('admin_dashboard.htmx_resources_card') }}"
                   hx-trigger="change"
                   hx-include="this"
                   hx-target="#resourcesSection"
                   hx-swap="innerHTML">
            <label class="form-check-label small text-muted fw-normal" for="resourcesCardActiveOnly">Active only</label>
        </div>
    </div>
    <div id="resourcesSection"
         hx-get="{{ url_for('admin_dashboard.htmx_resources_card') }}?active_only=1"
         hx-trigger="load once"
         hx-swap="innerHTML">
        <div class="card-body text-center text-muted py-4" role="status">
            <i class="fas fa-spinner fa-spin fa-2x" aria-hidden="true"></i>
            <p class="mt-2">Loading...</p>
        </div>
    </div>
</div>
{% endblock %}
