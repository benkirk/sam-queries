{#- Why a request form cannot open, into #xrasRequestModalBody. Context: title, message, variant. -#}
{% from 'dashboards/fragments/modals.html' import modal_title %}
{{ modal_title('xrasRequestModalLabel', title, 'paper-plane') }}
<div class="modal-body">
    <p class="mb-0 text-{{ variant }}-emphasis"><i class="fa-solid fa-circle-info me-1"></i>{{ message }}</p>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
</div>
