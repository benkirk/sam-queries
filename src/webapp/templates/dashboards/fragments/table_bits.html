{#
  Small shared pieces of a data table; the column-role classes they pair with
  (.col-shrink, .col-num, .cell-truncate, .btn-row) live in components.css.

    {% call pane_toolbar('5 types, 18 resources') %}<button ...>{% endcall %}
    {{ group_count(3) }}            count badge on a group header row
    {{ state_tag('decommissioned', title='Since 2024-01-31') }}
    {{ share_bar(31.0, slot=3) }}   bar + number; slot = facility color family
    {{ tree_label_cell('UNIV', count=4) }}   chevron + name cell of a collapse-toggle row
    {{ alloc_meter(53.0, elapsed_pct=48.0, slot=2) }}   % used bar with a time-elapsed tick
    {{ alloc_meter(28.9, pool_pct=61.8) }}   a shared row: own share solid over the pool's
#}

{# Count on the left, create buttons on the right; sits above the table. #}
{% macro pane_toolbar(summary) -%}
<div class="pane-toolbar d-flex flex-wrap align-items-center gap-2 px-3 py-2">
    <span class="text-muted small me-auto">{{ summary }}</span>
    {%- if caller is defined %}{{ caller() }}{% endif %}
</div>
{%- endmacro %}

{% macro group_count(n, title='') -%}
<span class="badge bg-secondary count-badge ms-2"{% if title %} title="{{ title }}"{% endif %}>{{ n | fmt_number }}</span>
{%- endmacro %}

{# A neutral fact about a row (why it is dim), not a signal. #}
{% macro state_tag(label, title='') -%}
<span class="badge state-tag ms-2"{% if title %} title="{{ title }}"{% endif %}>{{ label }}</span>
{%- endmacro %}

{# A share of a parent, 0-100. slot: a facility_slots() hue; tint: a child's share. #}
{% macro share_bar(pct, slot=None, tint=False, title='') -%}
{%- if pct is none -%}<span class="text-muted">—</span>
{%- else -%}
<span class="share"{% if title %} title="{{ title }}"{% endif %}>
  <span class="share-bar{{ ' share-tint' if tint }}{{ ' share-zero' if not pct }}"{% if slot %} data-fs="{{ slot }}"{% endif %}
        style="--share: {{ [[pct, 0] | max, 100] | min }}%" aria-hidden="true"></span>
  <span class="share-num">{{ pct | fmt_pct(decimals=2) }}</span>
</span>
{%- endif -%}
{%- endmacro %}

{# Percent of an allocation used (may pass 100), with an optional tick at percent of time elapsed.
   pool_pct: a shared row's whole pool, drawn as a lighter layer under this project's own share;
   the over state and its red then follow the pool. #}
{% macro alloc_meter(pct, elapsed_pct=None, slot=None, tint=False, title='', pool_pct=None) -%}
{%- if pct is none -%}<span class="text-muted">—</span>
{%- else -%}
{%- set over = (pool_pct if pool_pct is not none else pct) > 100 -%}
<span class="share"{% if title %} title="{{ title }}"{% endif %}>
  <span class="share-bar meter{{ ' share-tint' if tint }}{{ ' meter-over' if over }}{{ ' share-zero' if not pct }}{{ ' has-pool' if pool_pct is not none }}{{ ' has-elapsed' if elapsed_pct is not none }}"
        {%- if slot %} data-fs="{{ slot }}"{% endif %}
        style="--share: {{ [[pct, 0] | max, 100] | min }}%{% if pool_pct is not none %}; --pool: {{ [[pool_pct, 0] | max, 100] | min }}%{% endif %}{% if elapsed_pct is not none %}; --elapsed: {{ [[elapsed_pct, 0] | max, 100] | min }}%{% endif %}" aria-hidden="true"></span>
  <span class="share-num">{{ pct | fmt_pct }}</span>
</span>
{%- endif -%}
{%- endmacro %}

{# The first cell of a tree row that toggles a collapse (the row carries collapse_toggle). #}
{% macro tree_label_cell(label, depth=0, count=None, count_title='', cls='') -%}
<td class="tree-cell{{ ' tree-d%d' % depth if depth }} text-nowrap{{ ' ' ~ cls if cls }}" style="--depth: {{ depth }};">
    <i class="fa-solid fa-chevron-right small text-muted me-1 collapse-icon"></i>
    {{- '' }}<span class="tree-label">{{ label }}</span>
    {%- if count is not none %}{{ group_count(count, title=count_title) }}{% endif %}
</td>
{%- endmacro %}
