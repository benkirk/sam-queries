{% extends 'register/base_register.html' %}
{% block title %}Link expired{% endblock %}

{% block content %}
<h1>This link has expired or is not valid</h1>
<p class="register-lede">
    <a href="{{ again_url or url_for('register.form') }}">{{ (again_label or 'start a new request') | capitalize }}</a>
    to get a new link.
</p>
{% endblock %}
