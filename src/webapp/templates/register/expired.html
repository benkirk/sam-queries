{% extends 'register/base_register.html' %}
{% block title %}Link expired{% endblock %}

{% block content %}
<h1>That link is no longer valid</h1>
<div class="register-callout warn">
    <p><i class="fa-solid fa-clock" aria-hidden="true"></i>
    It may have expired, or it may not be a confirmation link at all.</p>
</div>
<p class="register-lede">
    Please <a href="{{ again_url or url_for('register.form') }}">{{ again_label or 'register again' }}</a> to receive
    a fresh one.
</p>
{% endblock %}
