{% extends 'register/base_register.html' %}
{% block title %}Event code not accepted{% endblock %}

{% block content %}
<h1>That event code is not accepted</h1>
<div class="register-callout warn">
    <p><i class="fa-solid fa-ban" aria-hidden="true"></i> {{ reason }}</p>
</div>
<p class="register-lede">
    Check the code with whoever gave it to you, or
    <a href="{{ url_for('register.form') }}">register without one</a>.
</p>
{% endblock %}
