name: SAM Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, staging, integration]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

# Four independent jobs on four runners, so a red check names what failed.
# Each pays its own stack setup (.github/actions/test-stack). pytest runs inside
# the samuel container and reaches the test DBs by compose hostname; the suite's
# safety allowlist approves mysql-test:3306 and postgres-test:5432.
jobs:
  pytest-mysql:
    name: Test Suite (MySQL, coverage)
    # Skip on [skip ci] / [ci skip] / [no ci] in commit message or PR title
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]')
      && !contains(github.event.head_commit.message, '[ci skip]')
      && !contains(github.event.head_commit.message, '[no ci]')
      && !contains(github.event.pull_request.title, '[skip ci]')
      && !contains(github.event.pull_request.title, '[ci skip]')
      && !contains(github.event.pull_request.title, '[no ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Start the test stack
        uses: ./.github/actions/test-stack

      # Branch coverage and the fail_under floor live in pyproject.toml. The XRAS
      # audit-row scenarios (tests/api/xras_audit_rows/) run here as part of the
      # default suite.
      - name: Run pytest with coverage
        run: |
          docker compose exec -T \
            -e SAM_TEST_DB_URL='mysql+pymysql://root:root@mysql-test:3306/sam' \
            samuel bash -c "cd /code && pytest --cov=src --cov-report=term-missing --cov-report=html"

      - name: Copy coverage report from container
        if: always()
        run: docker compose cp samuel:/code/htmlcov ./htmlcov || echo "No coverage report generated"

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-html
          path: htmlcov/
          if-no-files-found: ignore
          retention-days: 30

      - name: Show container logs
        if: failure()
        run: docker compose logs --tail=200

  # The default tier on a Postgres copy built inside the stack from mysql-test
  # (docs/plans/implemented/POSTGRES_MIGRATION.md). tests/postgres_expected_failures.txt
  # is empty, so this is a plain pass/fail leg.
  pytest-postgres:
    name: Test Suite (Postgres)
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]')
      && !contains(github.event.head_commit.message, '[ci skip]')
      && !contains(github.event.head_commit.message, '[no ci]')
      && !contains(github.event.pull_request.title, '[skip ci]')
      && !contains(github.event.pull_request.title, '[ci skip]')
      && !contains(github.event.pull_request.title, '[no ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Start the test stack
        uses: ./.github/actions/test-stack
        with:
          services: samuel mysql-test postgres-test

      - name: Build the Postgres copy from mysql-test
        run: |
          docker compose exec -T \
            -e PG_TEST_SOURCE_URL='mysql+pymysql://root:root@mysql-test:3306/sam' \
            -e PG_TEST_HOST=postgres-test -e PG_TEST_PORT=5432 \
            samuel make -C /code/containers/sam-sql-dev clone-pg-test

      - name: Run pytest against postgres-test
        run: |
          docker compose exec -T \
            -e SAM_TEST_DB_URL='postgresql+psycopg2://sam_test:sam_test@postgres-test:5432/sam' \
            samuel bash -c "cd /code && pytest"

      - name: Show container logs
        if: failure()
        run: docker compose logs --tail=200

  # Query-count limits (tests/perf/baselines.json) and benchmarks; MySQL only.
  perf:
    name: Perf Tier (MySQL)
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]')
      && !contains(github.event.head_commit.message, '[ci skip]')
      && !contains(github.event.head_commit.message, '[no ci]')
      && !contains(github.event.pull_request.title, '[skip ci]')
      && !contains(github.event.pull_request.title, '[ci skip]')
      && !contains(github.event.pull_request.title, '[no ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Start the test stack
        uses: ./.github/actions/test-stack

      - name: Run perf regression tests (query counts + benchmarks)
        run: |
          docker compose exec -T \
            -e SAM_TEST_DB_URL='mysql+pymysql://root:root@mysql-test:3306/sam' \
            samuel bash -c "cd /code && pytest -m perf -n 0 -v --tb=short"

      - name: Show container logs
        if: failure()
        run: docker compose logs --tail=200

  # api-demo/ run end to end against the live stack, from the runner (curl, jq and
  # python3 are on ubuntu-latest; the samuel image has neither curl nor jq). The
  # snapshot carries no API keys, so one is minted with both legacy roles the
  # ldapsync/ and xras/ families need.
  api-demo:
    name: API demo smoke
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]')
      && !contains(github.event.head_commit.message, '[ci skip]')
      && !contains(github.event.head_commit.message, '[no ci]')
      && !contains(github.event.pull_request.title, '[skip ci]')
      && !contains(github.event.pull_request.title, '[ci skip]')
      && !contains(github.event.pull_request.title, '[no ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      # One actor makes every call; keep the per-user limit out of the way.
      - name: Prepare .env
        run: echo "RATELIMIT_AUTHED=10000 per minute" > .env

      - name: Start the stack
        uses: ./.github/actions/test-stack
        with:
          services: samuel

      - name: Mint an API key
        run: |
          KEY=$(openssl rand -hex 24)
          echo "::add-mask::$KEY"
          echo "SAM_API_PASS=$KEY" >> "$GITHUB_ENV"
          docker compose exec -T samuel python scripts/gen_api_key.py \
              --username apidemo --key "$KEY" --rounds 4 --prefix 2a \
              --role ROLE_API_ADMIN --role ROLE_XRAS --sql-only \
            | docker compose exec -T mysql mysql -uroot -proot sam

      - name: Run every example (bash, then Python)
        env:
          SAM_API_BASE: http://localhost:7050
          SAM_API_USER: apidemo
        run: api-demo/run_all.sh

      - name: Show container logs
        if: failure()
        run: docker compose logs --tail=200 samuel
