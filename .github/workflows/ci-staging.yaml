name: Staging CI

on:
  pull_request:
    branches: [staging]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

# The test suites for PRs into staging come from sam-ci-docker.yaml, which
# triggers on them too; do not re-add them here.
jobs:
  secret-scan:
    name: Secret Scan
    # Skip on [skip ci] / [ci skip] / [no ci] in commit message or PR title
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]')
      && !contains(github.event.head_commit.message, '[ci skip]')
      && !contains(github.event.head_commit.message, '[no ci]')
      && !contains(github.event.pull_request.title, '[skip ci]')
      && !contains(github.event.pull_request.title, '[ci skip]')
      && !contains(github.event.pull_request.title, '[no ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@v3.97.9
        with:
          # --exclude-detectors=lob: the Lob (postal mail API) detector matches
          # `test_` followed by 35 word characters, so ANY Python test method
          # named exactly 40 characters is reported -- as `verified`, since the
          # Lob verifier accepts them. 99 such names are already committed here.
          # They pass today only because TruffleHog scans a commit range rather
          # than the tree, so a PR that adds or touches one fails out of
          # nowhere; renaming does not help, because every commit in the range
          # is scanned and so are commit messages. SAM does not use Lob.
          extra_args: >-
            --only-verified
            --results=verified,unknown
            --exclude-detectors=lob

  lint:
    name: Lint
    # Skip on [skip ci] / [ci skip] / [no ci] in commit message or PR title
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]')
      && !contains(github.event.head_commit.message, '[ci skip]')
      && !contains(github.event.head_commit.message, '[no ci]')
      && !contains(github.event.pull_request.title, '[skip ci]')
      && !contains(github.event.pull_request.title, '[ci skip]')
      && !contains(github.event.pull_request.title, '[no ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - name: MegaLinter
        uses: oxsecurity/megalinter/flavors/cupcake@v10
        env:
          VALIDATE_ALL_CODEBASE: false
          DISABLE_ERRORS: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload MegaLinter reports
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: MegaLinter reports
          include-hidden-files: "true"
          path: |
            megalinter-reports
            mega-linter.log
          retention-days: 7

  terraform-check:
    name: Terraform Validation
    # Skip on [skip ci] / [ci skip] / [no ci] in commit message or PR title
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]')
      && !contains(github.event.head_commit.message, '[ci skip]')
      && !contains(github.event.head_commit.message, '[no ci]')
      && !contains(github.event.pull_request.title, '[skip ci]')
      && !contains(github.event.pull_request.title, '[ci skip]')
      && !contains(github.event.pull_request.title, '[no ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.7

      - name: Terraform fmt check
        run: terraform fmt -check -recursive infrastructure/staging/

  helm-render:
    name: Helm Chart Render
    # Skip on [skip ci] / [ci skip] / [no ci] in commit message or PR title
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]')
      && !contains(github.event.head_commit.message, '[ci skip]')
      && !contains(github.event.head_commit.message, '[no ci]')
      && !contains(github.event.pull_request.title, '[skip ci]')
      && !contains(github.event.pull_request.title, '[ci skip]')
      && !contains(github.event.pull_request.title, '[no ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - name: Helm lint (chart)
        run: helm lint helm/

      - name: Helm template renders cleanly (production values)
        run: helm template samuel helm/ -f helm/values.yaml > /dev/null

      - name: Helm template renders cleanly (local dev values)
        run: helm template samuel helm/ -f helm/values.yaml -f helm/values-local.yaml > /dev/null

      - name: Helm template renders cleanly (samuel-dev values)
        run: helm template samuel-dev helm/ -f helm/values.yaml -f helm/values-dev.yaml > /dev/null

      # Every script in helm/tests/, not a hand-maintained list. Naming them
      # individually is how a new render test gets written and then silently
      # never runs.
      - name: Helm render assertions
        run: make helm-test
