[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "samuel"
version = "0.1.0"
description = "Systems Accounting Manager (SAM) System - ORM, CLI tools, and Webapp"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "NCAR/CISL internal use" }
authors = [
  { name = "NCAR/CISL", email = "csg@ucar.edu" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: Flask",
    "Private :: Do Not Upload"
]

dependencies = [
    # ... other dependencies from PyPI
    "alembic",
    "bcrypt",
    "cachetools",
    "click",
    "cryptography",
    "flask",
    "flask-admin",
    "flask-caching",
    "flask-limiter",
    "flask-login",
    "flask-sqlalchemy",
    "flask-wtf",
    "gunicorn",
    # Declared, not inherited. sam.notify.render imports jinja2 directly, and
    # until now it only arrived transitively via flask — which makes a
    # flask-less `sam` install (the CLI is not a Flask app) an ImportError
    # waiting for someone to try it.
    "jinja2",
    "limits[redis]",
    "marshmallow-sqlalchemy",
    "matplotlib",
    "psycopg2-binary",
    "pymysql",
    "python-dotenv",
    "pyyaml",
    "authlib>=1.3.0,<2.0.0",
    "redis>=5.0",
    "requests",
    "rich",
    "sqlalchemy",
    "tqdm",
]

[project.scripts]
sam-search = "cli.cmds.search:cli"
sam-admin = "cli.cmds.admin:cli"
sam-status = "system_status:main"

[project.optional-dependencies]
hpc = [
    # hpc-usage-queries: job history & charge summary ingest (sam-admin accounting --comp)
    "hpc-usage-queries[postgres] @ git+https://github.com/benkirk/hpc-usage-queries.git",
]
test = [
    "pytest",
    "pytest-benchmark", # benchmarking
    "pytest-cov",       # --cov=src coverage reports (CI: sam-ci-docker.yaml)
    "pytest-timeout",   # pytest.ini timeout = 300
    "pytest-xdist",     # pytest.ini addopts -n auto (parallel)
    "fakeredis>=2.20",  # in-memory Redis for cache adapter tests
    # Deps deferred until their workstream lands (see
    # docs/plans/implemented/TEST_SUITE_RESIDUALS.md):
    #   factory-boy, faker            → Gap A / future factories
    #   pyright                       → Gap B type checking
    # Re-add to this list when starting the corresponding workstream.
]
e2e = [
    # Browser regression net (e2e/) — see docs/plans/implemented/FRONTEND_TEST_NET.md.
    # Deliberately NOT folded into [test]: the 8-minute sam-ci-docker path must
    # not start installing browser libraries. Installed only by the
    # browser-smoke.yaml workflow and by devs running `make e2e`.
    #
    # Pinned with an upper bound because .github/dependabot.yml is scoped to
    # github-actions on purpose ("Python dependencies … are a separate
    # decision"), so nothing bumps this for us. Pinning the driver also pins
    # the Chromium build that `playwright install` fetches.
    "pytest",
    "pytest-playwright>=0.7,<0.8",
    "pytest-timeout",   # e2e/pytest.ini timeout = 120
]
dev = ["samuel[test]", "jupyterlab", "pandas", "pre-commit"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Notification templates ship INSIDE the package. There is no MANIFEST.in and
# nothing else here declares package data, so without this line
# sam/notify/templates/ is simply absent from a built wheel — invisible today
# only because everything runs from an editable install.
[tool.setuptools.package-data]
"sam.notify" = ["templates/*"]

[tool.coverage.run]
source = ["src/sam", "src/scheduling", "src/system_status", "src/webapp"]
omit = [
    "src/sam/queries/examples.py",
        "src/webapp/utils/project_permissions.py",
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/migrations/*",
    "*/scripts/*",

    # Jinja templates. Jinja compiles each template to a Python code object
    # whose co_filename is the template's own path, so coverage's tracer
    # records rendered *.html templates as "measured files". The HTML
    # reporter then tries to syntax-highlight them as Python — harmless on
    # some toolchains (skipped with a warning) but a hard INTERNALERROR on
    # Python 3.14 + newer coverage, which calls ast.parse() on the CSS.
    # Templates are never valid coverage targets; exclude them outright.
    "*/templates/*",

    # Deferred workstream: admin HTMX dashboard routes. Tracked separately;
    # exercised via manual QA + smoke tests in tests/integration/.
    "src/webapp/dashboards/admin/blueprint.py",
    "src/webapp/dashboards/admin/projects_routes.py",
    "src/webapp/dashboards/admin/orgs_routes.py",
    "src/webapp/dashboards/admin/resources_routes.py",
    "src/webapp/dashboards/admin/facilities_routes.py",

    # User/status dashboards — same HTMX-route workstream, untested by design.
    "src/webapp/dashboards/user/blueprint.py",
    "src/webapp/dashboards/status/blueprint.py",
    "src/webapp/dashboards/project_members.py",

    # CLI presentation layer — Rich console rendering. The sibling
    # builders.py modules contain the actual logic and are tested at 100%.
    "src/cli/project/display.py",
    "src/cli/accounting/display.py",
    "src/cli/allocations/display.py",
    "src/cli/user/display.py",
    "src/system_status/cli.py",

    # Admin-page query builders — eager-loading scaffolding consumed only by
    # the deferred admin HTMX routes. Coverage follows the route policy.
    "src/sam/queries/admin.py",

    # Trivial entry-point shim
    "src/sam_search_cli.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "\\.\\.\\.",
    "return NotImplemented",
]
show_missing = true
precision = 2
# 75.0 gives a ~7-point safety margin below the current 81.90% baseline
# (after the deferred admin/user HTMX dashboard routes were moved to
# `omit` and Bucket-3 targeted tests landed). Bump this as we add
# coverage, don't drop it.
fail_under = 75.0

[tool.coverage.html]
directory = "htmlcov"

# Note: pytest configuration lives in /pytest.ini at the repo root, not here.
# A duplicate [tool.pytest.ini_options] section used to live in this file
# but was dead code (pytest.ini takes precedence) and drifted from reality.
# The root pytest.ini has the authoritative config: testpaths, addopts,
# markers, xdist parallelism, and the --no-cov default for inner-loop speed.