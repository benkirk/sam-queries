# samuel-dev: the routable dev deployment (docs/plans/implemented/K8S_DEV_ENVIRONMENT.md).
# Layered on values.yaml: helm template samuel-dev helm -f values.yaml -f values-dev.yaml
# NEVER add an `image:` line here; CI pins the image in values.yaml on cirrus-dev.
replicaCount: 1
podDisruptionBudget:
  enabled: false                          # minAvailable 1 on 1 replica blocks drains

cache:
  name: samuel-dev-redis
  maxmemoryMB: 64
  requests:
    memory: 32Mi
    cpu: 25m
  limits:
    memory: 128Mi
    cpu: 250m

webapp:
  name: samuel-dev
  group: samuel-dev
  tls:
    fqdn: samuel-dev.k8s.ucar.edu
    extraHosts: []
    secretName: incommon-cert-samuel-dev
  container:
    requests:
      memory: 1024M
      cpu: 1
    limits:
      memory: 4G
      cpu: 4
  env:
    FLASK_CONFIG: "production"            # ProductionConfig.validate() is the auth interlock
    AUTH_PROVIDER: "oidc"
    DISABLE_AUTH: "0"
    ACCOUNT_REGISTRATION_ENABLED: "1"     # the anonymous account-creation form, live here and dark in prod
    ACCOUNT_REGISTRATION_LOGIN_REQUIRED: "0"  # /register and /request open to visitors (prod: login-gated)
    ACCOUNT_INVITATIONS_ENABLED: "1"      # invitations, invite links and the event pages, live here as in prod
    COMPONENT_GALLERY_ENABLED: "1"        # the /dev/gallery component gallery, live here and dark in prod
    SAM_DB_DRIVER: "postgresql"
    SAM_DB_SERVER: "csg-postgres.k8s.ucar.edu"
    SAM_DB_PORT: "5432"
    SAM_DB_NAME: "sam_dev"                # rebuilt by `make refresh-dev`; dev writes are discarded
    SAM_DB_REQUIRE_SSL: "true"
    STATUS_DB_NAME: "system_status_dev"   # own task_run ledger, so dev never settles a prod slot
    NOTIFY_ENABLED: "0"                   # the relay reaches any address; "1" needs NOTIFY_REDIRECT_TO
    PUBLIC_BASE_URL: ""                   # mail links follow the request host, not prod's sam.hpc
    NOTIFY_XRAS_CC: ""
    NOTIFY_XRAS_REPLY_TO: ""
    NOTIFY_ACCOUNT_TICKET_TO: ""          # dev never files a Jira ticket
    # XRAS, both directions, against XRAS's DEMO instance and never api.xras.org:
    # xras-admin-demo posts here, and the sweep and the write client call the
    # demo API with prod's key at its own OpenBao path (xrasApiCredentials below).
    # test-dev-render.sh rejects the production base URL and secret path.
    # Dispatch is live: sam_dev.xras_action_log was empty at the flip (2026-10-08)
    # and refresh-dev empties it again. Record: docs/plans/XRAS_SUBMISSION.md section 5.
    XRAS_API_BASE: "https://xras-submit-api-demo.xsede.org"
    XRAS_OUTGOING_ENABLED: "1"
    XRAS_WRITE_ENABLED: "1"
    XRAS_RENAME_ENABLED: "1"              # the after-reply rename (prod: "1" too; both gated)
    XRAS_SUBMIT_ENABLED: "1"              # My Requests files to the demo (prod: "0"); webapp only
    XRAS_SUBMIT_ACTION_TYPES: "all"       # prod narrows to Extension,Supplement; unset is none
    XRAS_SUBMIT_ANONYMOUS_ENABLED: "1"    # a visitor's New at /request/ (prod: "0"); webapp only
    XRAS_AUTO_ACTIVATE: "1"               # a New that applies activates its project (prod: "1" too)
    XRAS_AUTO_NOTIFY: "1"                 # then mails it; NOTIFY_ENABLED=0 keeps that a no-send
    SAM_TASKS_XRAS_NOTICES_SINCE: ""      # no cutover floor on dev
    XRAS_ACTIONS_CAPTURE_ONLY: "0"
    TICKET_PROVIDER: ""                   # dev files no API ticket
    XRAS_REQUEST_TICKETS_ENABLED: "1"     # the 422's ticket line, beside the task's dry-run filing
    SAM_TASKS_XRAS_TICKETS_SINCE: ""      # no floor on dev, as in its tasks.env
    NOTIFY_XRAS_REQUESTS_URL: "https://samuel-dev.k8s.ucar.edu/allocations/xras?view=remediations"
    JIRA_ENABLED: "0"
    JIRA_WRITE_ENABLED: "0"
    # The LDAP sync shadow (docs/plans/LDAPSYNC_DEV_SHADOW.md): all three live. The daemon
    # cannot call lifecycle yet (the #774 comment), so a finish here is driven by hand.
    # Prod keeps lifecycle off until the conditions in LDAP_SYNC_API.md § 10.6 hold.
    LDAPSYNC_PURGE_ENABLED: "1"
    LDAPSYNC_RESTORE_ON_REACTIVATE: "1"
    LDAPSYNC_LIFECYCLE_ENABLED: "1"
    # The directory client reads ldap.ucar.edu after each shadow PUT and logs the drift
    # (report only; no DIRECTORY_APPLY_<KIND> here until step 2 soaks). Prod: all empty.
    DIRECTORY_PROVIDER: "ucar"
    DIRECTORY_URL: "ldap://ldap.ucar.edu"
    DIRECTORY_CHECK_ON_SYNC: "1"
    # Role catalog: "defaults" reads the code bundles, "db" the samuel_role_*
    # tables (seeded by `sam-admin rbac --seed`; keys granted by name) with no
    # fallback, and holds API keys to each token route's Permission. Flip only
    # after the DDL and the seed have run on this database.
    RBAC_SOURCE: "db"
    # Dev-only bcrypt hash; plaintext is SAM_DEV_API_PASS in the laptop .env.
    API_KEYS_COLLECTOR: "$2b$12$cT8gWOKQtobRHrs1/lgVaeiUL6mivFdfsctyFImGRgulhd8I11mb6"
    # sam-admin cache --refresh credential (api_admin grant); plaintext is
    # SAM_CACHE_REFRESH_API_PASS_DEV in the laptop .env.
    API_KEYS_CACHEREF: "$2b$12$nvmZU6FjXiwutAIn1tSDpugXbVhw1qzYdk3nWekw2W21qcZHiSwHq"
    SAM_API_BASE: "https://samuel-dev.k8s.ucar.edu"   # sam-admin cache --refresh defaults to prod
    # Dev is the load-test target: no throttling of authed, M2M or anonymous
    # traffic. RATELIMIT_AUTH_LOGIN stays at the prod default (guards the OIDC
    # callback; nothing legitimate hammers it). Flask-Limiter notation.
    RATELIMIT_AUTHED: "100000 per minute"
    RATELIMIT_M2M: "100000 per minute"
    RATELIMIT_ANON: "100000 per minute"
    # /register and /request are public here (Turnstile on, mail off: an operator's Verify
    # confirms): a low site-wide ceiling on their POSTs while they are shown around.
    RATELIMIT_REGISTER_GLOBAL: "5 per hour; 20 per day"
  samDbCredentials:
    secretPath: csg/sam-dev-pg            # the sam_dev owner role (SAM_DEV_PG_USER)
  oidcCredentials:
    secretPath: csg/sam-dev-oidc
  xrasApiCredentials:
    secretPath: csg/xras-dev-api-key      # prod's key today, at a path of its own
  jiraCredentials:
    enabled: false                        # levers off; do not hold the PAT

tasks:
  name: samuel-dev-tasks
  env:
    SAM_API_BASE: "https://samuel-dev.k8s.ucar.edu"
    # xras_sweep runs: it and XRAS_OUTGOING_ENABLED are one decision.
    SAM_TASKS_DISABLED: "expiration_notices,xras_notices,account_requests_reconcile,account_queue_digest"
    # Arms xras_rename against XRAS-dev, the one task write (values.yaml's
    # XRAS_WRITE_ENABLED warning).
    XRAS_WRITE_ENABLED: "1"
    # xras_request_tickets runs end to end but posts nothing: dry-run logs each ticket
    # and comment and mints DRY-<handle> keys. No Jira write lever, no token, no floor
    # (values.yaml's tasks.env carries all three for production).
    XRAS_REQUEST_TICKETS_ENABLED: "1"
    TICKET_PROVIDER: "dry-run"
    JIRA_WRITE_ENABLED: "0"
    SAM_TASKS_XRAS_TICKETS_SINCE: ""
