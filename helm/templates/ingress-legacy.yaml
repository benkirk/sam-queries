{{- /*
  LEGACY cutover bridge (webapp.ingress.legacyBridge): the same hosts on the
  retired nginx class so the old VIP keeps serving while DNS moves to Traefik's.
  No cert-manager annotation: it reuses the Secret the main Ingress owns.
*/}}
{{- with .Values.webapp.ingress.legacyBridge }}
{{- if .enabled }}
{{- $hosts := concat (list $.Values.webapp.tls.fqdn) (default (list) $.Values.webapp.tls.extraHosts) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Values.webapp.name }}-legacy
  namespace: {{ $.Release.Namespace }}
  labels:
    group: {{ $.Values.webapp.group }}
spec:
  ingressClassName: {{ .className }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ $.Values.webapp.tls.secretName }}
  rules:
  {{- range $host := $hosts }}
  - host: {{ $host | quote }}
    http:
      paths:
      - path: {{ $.Values.webapp.path }}
        pathType: Prefix
        backend:
          service:
            name: {{ $.Values.webapp.name }}
            port:
              number: {{ $.Values.webapp.container.port }}
  {{- end }}
{{- end }}
{{- end }}
