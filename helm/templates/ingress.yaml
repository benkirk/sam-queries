apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.webapp.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    group: {{ .Values.webapp.group }}
  annotations:
    cert-manager.io/cluster-issuer: "incommon"
{{- $class := required "webapp.ingress.className is required" .Values.webapp.ingress.className }}
{{- with .Values.webapp.ingress.traefik.entrypoints }}
    traefik.ingress.kubernetes.io/router.entrypoints: {{ . | quote }}
{{- end }}
{{- /*
  Every host this ingress answers for: the platform-primary `fqdn` (which
  becomes the cert CN) followed by any advertised aliases. Listing them all in
  a single `tls:` entry makes cert-manager issue ONE multi-SAN certificate
  covering the lot.
  `default (list)` keeps values-local.yaml (no extraHosts) rendering a single
  localhost rule.
*/}}
{{- $hosts := concat (list .Values.webapp.tls.fqdn) (default (list) .Values.webapp.tls.extraHosts) }}
spec:
  ingressClassName: {{ $class }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .Values.webapp.tls.secretName }}
  rules:
  {{- range $host := $hosts }}
  - host: {{ $host | quote }}
    http:
      paths:
      - path: {{ $.Values.webapp.path }}
        pathType: Prefix
        backend:
          service:
            name: {{ $.Values.webapp.name }}
            port:
              number: {{ $.Values.webapp.container.port }}
  {{- end }}
