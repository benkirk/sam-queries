replicaCount: 2

# Rollout safety: never drop below replicaCount Ready pods during an update.
# maxUnavailable:0 + maxSurge:1 means "bring up one new pod, wait for it to
# pass the readiness probe, THEN retire an old one." Without the readiness
# probe (webapp.probes) this gating is meaningless — a pod is "Ready" the
# instant its process starts, so a broken build would still complete the
# rollout while serving errors.
rollout:
  maxUnavailable: 0
  maxSurge: 1

# Old (scaled-to-0) ReplicaSets retained per Deployment for rollback history.
# k8s defaults to 10, which clutters the ArgoCD view; GitOps rollback is via
# git revert + resync, so keep a small number. Applies to webapp AND redis.
revisionHistoryLimit: 3

# PodDisruptionBudget — keep >=minAvailable webapp pods serving during
# VOLUNTARY disruptions (node drains, cluster maintenance). Without this, a
# single node drain can evict both replicas at once and take the app down.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Spread replicas across nodes so one node failure can't take out all of them.
# whenUnsatisfiable: ScheduleAnyway keeps scheduling best-effort on a lopsided
# cluster rather than leaving a pod Pending (which is what wedged us at 1/2).
topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

# Centralized Redis: Flask-Caching chart cache (CACHE_REDIS_URL -> DB 0) and
# Flask-Limiter rate-limit counters (RATELIMIT_STORAGE_URI -> DB 1).
# Single replica, no persistence, no HA.
#
# allkeys-lru is instance-GLOBAL: under memory pressure Redis is free to evict
# the rate limiter's DB 1 counters, so headroom is the safe direction. The
# container limit keeps ~1.7x maxmemory for overhead and fragmentation.
# Before changing maxmemoryMB, check `INFO stats: evicted_keys` and
# `INFO memory: used_memory_peak_human`. Sizing measurements and what drove
# 192 MB: docs/plans/implemented/REDIS.md, "Sizing history".
cache:
  enabled: true
  name: samuel-redis
  image: docker.io/library/redis:7-alpine
  port: 6379
  maxmemoryMB: 192
  requests:
    memory: 64Mi
    cpu: 50m
  limits:
    memory: 320Mi
    cpu: 500m
  # Pod/container security hardening. redis:7-alpine ships uid=999(redis)
  # gid=1000(redis) (verified: `docker run --rm redis:7-alpine id redis`);
  # its entrypoint execs redis-server directly when started non-root, and
  # `--save ""` means no /data writes.
  securityContext:
    pod:
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    container:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]

webapp:
  name: samuel
  group: samuel
  path: /
  tls:
    # Platform-primary name: unique, ends in .k8s.ucar.edu, and becomes the CN
    # of the issued certificate. Keep it — CIRRUS automation and the parity /
    # systems-integration tooling all address the app by this name.
    fqdn: samuel.k8s.ucar.edu
    # Advertised alias(es), served in parallel with fqdn (no redirect between
    # them). Each renders its own ingress rule and joins the single multi-SAN
    # cert below. sam.hpc.ucar.edu is a CNAME -> samuel.k8s.ucar.edu; the same
    # pattern gdex.ucar.edu uses on this ingress controller.
    extraHosts:
      - sam.hpc.ucar.edu
    secretName: incommon-cert-samuel      # one multi-SAN secret covers every host above
  ingress:
    visibility: external                  # internal or external
    # Edge rate limiting (nginx ingress controller), IN FRONT of the app-layer
    # Flask-Limiter. IMPORTANT: on the nwc1 nginx-external controller every
    # client currently presents as 127.0.0.1 — X-Forwarded-For is not
    # propagated to the controller (see proxyFixForwardedHops) — so limit-rps /
    # limit-connections act as ONE GLOBAL bucket, NOT per-client. Values below
    # are a deliberately HIGH blunt flood-backstop that legitimate aggregate
    # traffic should not reach; revisit to proper per-IP values once the
    # controller forwards real client IPs. Set rps: 0 to disable all three.
    rateLimit:
      rps: 100                            # global req/sec backstop (limit-rps)
      connections: 200                    # global concurrent connections (limit-connections)
      burstMultiplier: 5                  # short-burst allowance = rps * this (limit-burst-multiplier)
  # Trusted proxy hops for ProxyFix (X-Forwarded-For depth). Sets PROXYFIX_X_FOR.
  # MUST equal the exact number of proxies that append to X-Forwarded-For, or a
  # client can spoof its IP. Start at 1 (safe), then confirm the real depth from
  # the gunicorn access-log xff="…" field and bump to match. See webapp/run.py.
  proxyFixForwardedHops: 1

  # capacities.json for the fairshare endpoint, rendered from
  # helm/files/capacities.json into a ConfigMap and mounted over the image's
  # baked /etc/sam/capacities.json. Edit that file (or the ConfigMap) + roll out
  # to retune N_cpu/N_gpu without an image rebuild. Set enabled:false to fall
  # back to the baked default only.
  capacities:
    enabled: true
    mountPath: /etc/sam/capacities.json
  # Kubernetes probes. Endpoints from src/webapp/api/v1/health.py:
  #   /live  -> process up, no DB call          (liveness + startup)
  #   /ready -> DB-gated, 200 healthy / 503 not  (readiness: gates rollout
  #             completion AND Service membership)
  # Liveness uses /live (no DB) so a transient DB blip can't trigger a
  # restart storm; readiness uses /ready so a DB outage pulls the pod from
  # the Service without killing it.
  probes:
    enabled: true
    path: /api/v1/health                 # base; /live and /ready appended
    startup:
      periodSeconds: 5
      failureThreshold: 30               # ~150s budget for gunicorn to boot (generous
                                         #   headroom from the pre-gthread 33-worker era;
                                         #   today's ~9 workers start much faster)
    liveness:
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      periodSeconds: 10
      timeoutSeconds: 5                  # readiness pings the DBs
      failureThreshold: 3
  # Pod/container security hardening. runAsUser MUST match the UID created in
  # containers/webapp/Dockerfile's production stage (USER 1000); runAsNonRoot
  # makes the kubelet enforce non-root even if a future image rebuild loses
  # the USER directive. readOnlyRootFilesystem deliberately deferred —
  # matplotlib's /tmp/mpl cache, gunicorn temp files, and the /var/log/sam
  # audit log all write the container layer.
  securityContext:
    pod:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    container:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
  container:
    image: ghcr.io/benkirk/sam-queries/webapp:main
    port: 5050
    requests:
      memory: 4096M
      cpu: 4
    limits:
      memory: 12G
      cpu: 16
  # Gunicorn concurrency (see deployment.yaml env block + gunicorn_config.py).
  # Threaded workers: a slow fs-scans scan holds a thread, not a process. The
  # 12G memory limit above is a candidate to lower once gthread per-pod usage
  # is observed — the old 33-process sync model drove that ceiling.
  # Empty workers/threads fall back to the template/config defaults.
  gunicorn:
    workerClass: gthread
    workers: ""                           # "" → 2×requests.cpu+1 (=9 at cpu request 4),
                                          # tracking GUARANTEED cores not the burst limit
    threads: 8                            # I/O concurrency per worker; scans are ~80% DB-bound
  env:
    DISABLE_AUTH: "0"                     # Explicitly disabled — must remain 0 in production
    FLASK_ADMIN_ENABLED: "0"              # Flask-Admin /database browser stays unmounted on the public deploy
    FLASK_DEBUG: "0"
    FLASK_CONFIG: "production"            # Selects ProductionConfig (DEBUG=False, SESSION_COOKIE_SECURE=True)
    AUDIT_ENABLED: "1"
    AUDIT_LOG_PATH: "/var/log/sam/model_audit.log"
    # Mirror audit entries to STDOUT — the durable sink (CIRRUS retains
    # container STDOUT for 45d; the log file is on ephemeral pod storage).
    AUDIT_LOG_STDOUT: "1"
    JUPYTERHUB_API_URL: "https://jupyterhub.hpc.ucar.edu"
    JUPYTERHUB_INSTANCE: "stable"
    JUPYTERHUB_CACHE_TTL: "300"
    SAM_DB_SERVER: "sam-sql.ucar.edu"
    SAM_DB_REQUIRE_SSL: "true"
    # Match the SAM DB server's timezone (sam-sql.ucar.edu runs Mountain). The
    # app stamps naive datetimes (AccountUser.start_date, allocation dates, …)
    # that are compared against the DB's NOW()/func.now(); a UTC pod put them
    # ~6h in the DB's future, so freshly-granted access read back as inactive.
    # system_status keeps its own explicit naive-UTC clock
    # (system_status.timeutil.utcnow_naive — there is no such symbol in sam.fmt).
    TZ: "America/Denver"
    # Notifications (sam.notify)
    # Relay facts MEASURED from a pod on nwc1, 2026-08-09
    # (docs/plans/implemented/NOTIFICATION_FRAMEWORK.md § 9):
    #   ndir.ucar.edu:25 reachable — no NetworkPolicy restricts webapp egress
    #   EHLO advertises STARTTLS, and NOT AUTH  -> no ExternalSecret needed,
    #     which is why MAIL_USERNAME/MAIL_PASSWORD are absent here entirely
    #   pod egress is the NODE address (128.117.217.72/.73), inside
    #     ucar.edu's SPF ip4:128.117.0.0/16 -> sam-admin@ucar.edu SPF-passes
    #   one real message pod -> benkirk@ucar.edu landed in the inbox
    #
    # WARNING: A future node OUTSIDE 128.117.0.0/16 falls out of that SPF record.
    #     `?all` is neutral rather than a hard fail, so mail would still be
    #     accepted — it would just start scoring worse, silently.
    MAIL_SERVER: "ndir.ucar.edu"
    MAIL_PORT: "25"
    MAIL_USE_TLS: "true"
    MAIL_TIMEOUT: "10"
    MAIL_DEFAULT_FROM: "sam-admin@ucar.edu"
    # Per-family addressing, NOTIFY_<FAMILY>_{CC,BCC,FROM,REPLY_TO}; the
    # family is NotificationKind.family (sam/notify/kinds.py: xras,
    # expiration, task). Comma lists for CC/BCC; empty means off. A FROM
    # override must stay a ucar.edu address for the SPF note above to hold.
    NOTIFY_XRAS_CC: "alloc@ucar.edu"
    NOTIFY_XRAS_BCC: ""
    NOTIFY_XRAS_FROM: ""
    NOTIFY_XRAS_REPLY_TO: "alloc@ucar.edu"
    # WARNING: EXPLICIT, not inherited. NOTIFY_ENABLED is fail-closed everywhere
    #     (sam.notify.NotifyConfig defaults it false) precisely so a dev
    #     container cannot mail real users. Production is the one place that
    #     must opt in, and it must do so visibly — ProductionConfig.validate()
    #     warns at startup if this is unset, so the disabled state is never
    #     silent.
    NOTIFY_ENABLED: "1"
    NOTIFY_TRANSPORT: "smtp"
    STATUS_DB_DRIVER: "postgresql"
    STATUS_DB_SERVER: "csg-postgres.k8s.ucar.edu"
    # STATUS_DB_POOL_* defaults (size=2, overflow=4, recycle=600) live in
    # webapp/run.py and are already sized for csg-postgres' 100-slot cap.
    # Override here only if a future deployment uses a different backing
    # database (e.g. dedicated postgres with more headroom).
    GOOGLE_CALENDAR_EMBED_URL: "https://calendar.google.com/calendar/embed?src=ucar.edu_o09r1n89tid1b8jkrvurc8qio4%40group.calendar.google.com&ctz=America%2FDenver"
    # OIDC SSO via Microsoft Entra. Client ID/secret/issuer and FLASK_SECRET_KEY
    # are injected via secretKeyRef from the oidcCredentials ExternalSecret below.
    AUTH_PROVIDER: "oidc"
    # NO OIDC_REDIRECT_URI here, deliberately. The ingress serves two hosts
    # (see .fqdn / .extraHosts above), and the callback must return to
    # whichever one the user started on: the PKCE/state cookie is scoped to
    # that origin, so a cross-host return fails with MismatchingStateError.
    # Leaving this unset makes webapp/auth/blueprint.py derive the callback
    # from the request host via url_for(..., _external=True), which ProxyFix
    # (x_host/x_proto, webapp/run.py) resolves from X-Forwarded-*. Setting it
    # would re-pin every host to one origin and break login on the others.
    OIDC_USERNAME_CLAIM: "preferred_username"
    OIDC_SCOPES: "openid email profile"
    # API keys for HPC status collectors (bcrypt hashes — safe to store here).
    # Generate with: python scripts/gen_api_key.py --username collector
    API_KEYS_COLLECTOR: "$2b$12$X8NQvOUvyrj80Ud3N6Y.0uZs70ZC6lJYy/zfka/v7uQQFKJhds0b2"
    # hpc-usage-queries plugin (per-job drill-down on resource-usage pages).
    # The plugin reads JOB_HISTORY_PG_* at engine-creation time;
    # JOB_HISTORY_PG_USER / JOB_HISTORY_PG_PASSWORD are injected below
    # from the jhDbCredentials ExternalSecret.
    JOB_HISTORY_DB_BACKEND: "postgres"
    JOB_HISTORY_PG_HOST: "csg-postgres-ro.k8s.ucar.edu"
    JOB_HISTORY_PG_PORT: "5432"
    JOB_HISTORY_MACHINES: "derecho,casper"
    # fs-scans plugin (filesystem-scan analytics on disk resource-details pages).
    # Same CNPG cluster as job_history above; collections (cisl, mmm, aiml, …)
    # are POSTGRES SCHEMAS within a per-resource database. The plugin reads
    # FS_SCAN_PG_* at engine-creation time; FS_SCAN_PG_USER / FS_SCAN_PG_PASSWORD
    # are injected below from the fsDbCredentials ExternalSecret (csg/pg-appuser,
    # same role as job_history). FS_SCANS_ENABLED is the SAM-side master switch —
    # set "0" to disable the integration entirely.
    #
    # FS_SCAN_PG_DB is the default/Campaign_Store database. FS_SCAN_RESOURCE_DATABASES
    # maps each scan resource to its database: Campaign_Store -> campaign, Destor ->
    # destor (the CNPG database is named `destor`; `desc1` is only the Lustre MOUNT
    # /lustre/desc1). The plugin reaches the second database via its `database=`
    # selector using these SAME host/credentials; the pg-appuser role already has
    # read access on `destor` (USAGE + SELECT on its collection schemas, same as
    # campaign). A resource whose database is unreachable simply warms nothing and
    # drops out of the UI.
    FS_SCANS_ENABLED: "1"
    # hpc-scheduling-tools fairshare endpoint (/api/v1/fairshare). The plugin
    # reads capacities.json via $HPC_SCHED_CAPACITIES, which the image bakes to
    # /etc/sam/capacities.json and the ConfigMap below mounts over (edit + roll
    # out to retune N_cpu/N_gpu without an image rebuild). Set "0" to disable.
    HPC_SCHEDULING_TOOLS_ENABLED: "1"
    HPC_SCHED_CAPACITIES: "/etc/sam/capacities.json"
    FS_SCAN_DB_BACKEND: "postgres"
    FS_SCAN_PG_HOST: "csg-postgres-ro.k8s.ucar.edu"
    FS_SCAN_PG_PORT: "5432"
    FS_SCAN_PG_DB: "campaign"
    FS_SCAN_RESOURCE_DATABASES: "Campaign_Store:campaign,Destor:destor"
    # XRAS action ingestion. CAPTURE_ONLY is the safety interlock: at "1" the
    # endpoint authenticates, parses and audits every post but dispatches nothing.
    #
    # WARNING: never flip this to "0" on a stack XRAS is ALREADY posting to. That
    # double-applies actions legacy has already applied, against live allocations,
    # with no undo. The precondition is checked, not assumed: no status='received'
    # rows in xras_action_log before the flip.
    #
    # Flipping late is the other failure: every post in the gap strands as
    # status='received', and `sam-admin xras --recheck` CANNOT apply one
    # (validate_only returns before management_transaction opens). Recovery is
    # asking the XRAS admin to push the button again, per action.
    #
    # Setting it back to "1" stops all dispatch, at that cost. To park one
    # misbehaving action type instead, narrow XRAS_ACTIONS_ENABLED below.
    # Triage: docs/xras/incoming/XRAS_TRIAGE_PLAYBOOK.md
    XRAS_ACTIONS_CAPTURE_ONLY: "0"
    # Per-type triage lever, checked only once CAPTURE_ONLY is off. "all" | "none" |
    # e.g. "Extension,Supplement". Narrow this to park a misbehaving payload class as
    # manual without a revert; an unknown token leaves that type disabled.
    XRAS_ACTIONS_ENABLED: "all"
    # XRAS Allocations API: SAM calling OUT to XRAS (docs/xras/outgoing/)
    # The opposite direction from the two levers above. Read-only and GET-only:
    # the client has no verb method but an internal _get, because the SAME key
    # can create requests, modify roles and merge one person into another.
    #
    # Fail-closed. With XRAS_OUTGOING_ENABLED "0" the account-creation card
    # renders its unconfigured state, the xras_sweep task records a skip, and
    # sam-admin degrades — nothing raises for lack of a key.
    #
    # WARNING: this and the `xras_sweep` task are ONE decision. The task SKIPS
    # while this is "0", and the Feed-B tab renders what the task publishes, so
    # enabling the task without this gives a permanently empty tab and a ledger
    # full of `skipped`.
    #
    # WARNING: The KEY is not here. It arrives from OpenBao via the
    # webapp.xrasApiCredentials ExternalSecret below, injected as XRAS_API_KEY
    # by secretKeyRef into BOTH deployment.yaml and cronjob-tasks.yaml.
    XRAS_OUTGOING_ENABLED: "1"
    XRAS_API_BASE: "https://api.xras.org"
    XRAS_ALLOCATIONS_PROCESS: "NCAR"
    # Required header on every call; scopes nothing outside /v1/requests, which
    # this client never reads. The value XRAS provisioned for the ARC scripts.
    XRAS_API_USER: "arcguest"
    # WARNING: SEPARATE lever for the WRITE client
    # (sam/integration/xras_api/admin_client.py), a different class from the read
    # client above, in the `submit` XRAS context. What it unlocks is not symmetric
    # with reading: the same key can MERGE one person into another — XRAS deletes
    # the source — withdraw an approved action, and change a request's roster.
    # Merge has no undo.
    #
    # This is webapp-only ON PURPOSE. cronjob-tasks.yaml renders `.Values.tasks.env`
    # plus a hand-listed set and inherits NOTHING from here, so a scheduled task cannot
    # write to XRAS even if one imported the admin client. Do not "fix" that by adding
    # it there. `tests/unit/test_xras_admin_client.py` asserts both halves: this key is
    # "0", and the tasks env never carries it at all.
    #
    # With it off the Remediations card still renders — with its controls DISABLED and
    # an explanation — rather than vanishing, so the state is visible rather than
    # mysterious. Armed 2026-08-25 (PR #482) for the triage-week identity merges;
    # the drift test in tests/unit/test_xras_admin_client.py pins whichever value
    # ships, so a flip in either direction is a reviewed change to both files.
    XRAS_WRITE_ENABLED: "1"

  # Each block below syncs one secret from OpenBao. `enabled: false` skips it;
  # `useExternalSecret: false` skips the ExternalSecret CRD so the secret can be
  # injected by hand. The *Key fields name the keys inside the OpenBao path.
  #
  # system_status DB credentials (injected as STATUS_DB_USERNAME / STATUS_DB_PASSWORD).
  # MUST be a non-superuser role — connecting as the postgres SUPERUSER causes
  # SAM's idle pool to consume the cluster's superuser_reserved_connections
  # quota, which then locks out other pguser-class consumers with FATAL
  # "remaining connection slots are reserved for roles with the SUPERUSER
  # attribute". Reuses csg/pg-appuser (the same pguser role used by the
  # hpc-usage-queries plugin). Required grants on system_status DB:
  #   GRANT CONNECT ON DATABASE system_status TO pguser;
  #   GRANT USAGE ON SCHEMA public TO pguser;
  #   GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO pguser;
  #   GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO pguser;
  #   ALTER DEFAULT PRIVILEGES IN SCHEMA public
  #     GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO pguser;
  #   ALTER DEFAULT PRIVILEGES IN SCHEMA public
  #     GRANT USAGE, SELECT ON SEQUENCES TO pguser;
  dbCredentials:
    enabled: true
    useExternalSecret: true
    secretStoreRefName: csg-ro
    secretPath: csg/pg-appuser            # pguser role (NOT csg/pg-superuser — see comment above)
    usernameKey: username
    passwordKey: password

  samDbCredentials:
    enabled: true
    useExternalSecret: true
    secretStoreRefName: csg-ro
    secretPath: csg/sam-writeuser
    usernameKey: username
    passwordKey: password

  # hpc-usage-queries plugin's per-machine job_history Postgres
  # (derecho_jobs / casper_jobs on csg-postgres-ro.k8s.ucar.edu).
  # Read-only application user — distinct from dbCredentials' pg-superuser
  # since the plugin only needs SELECT on the job_history tables.
  jhDbCredentials:
    enabled: true
    useExternalSecret: true
    secretStoreRefName: csg-ro
    secretPath: csg/pg-appuser
    usernameKey: username
    passwordKey: password

  # fs-scans plugin's filesystem-scan Postgres (campaign DB / per-collection
  # schemas on csg-postgres-ro.k8s.ucar.edu). Reuses the SAME csg/pg-appuser role
  # as jhDbCredentials above (read-only application user, SELECT on the scan
  # tables) — kept as a distinct block so the integration can be toggled and
  # rotated independently. Injected as FS_SCAN_PG_USER / FS_SCAN_PG_PASSWORD.
  fsDbCredentials:
    enabled: true
    useExternalSecret: true
    secretStoreRefName: csg-ro
    secretPath: csg/pg-appuser
    usernameKey: username
    passwordKey: password

  jupyterhubCredentials:
    enabled: true
    useExternalSecret: true
    secretStoreRefName: csg-ro
    secretPath: csg/jh-api-token
    tokenKey: token

  # XRAS Allocations API key — SAM calling OUT to XRAS. Same five-key shape as
  # jupyterhubCredentials above, and the same single-value payload.
  # WARNING: Consumed by TWO manifests: the Deployment (the dashboard card) and the
  # CronJob (the xras_sweep task). They share no env anchor, so the secretKeyRef
  # is written out in both — the same cross-referencing trap NOTIFY_* hit.
  xrasApiCredentials:
    enabled: true
    useExternalSecret: true
    secretStoreRefName: csg-ro
    secretPath: csg/xras-api-key
    tokenKey: token

  # OIDC SSO credentials + Flask session-signing key.
  # secretPath convention: csg/sam-{env}-oidc when multiple environments coexist.
  # csg/sam-oidc is shorthand for the production-equivalent (samuel.k8s.ucar.edu) deployment.
  # Future staging k8s deployment should override secretPath: csg/sam-staging-oidc in values-staging.yaml.
  oidcCredentials:
    enabled: true
    useExternalSecret: true
    secretStoreRefName: csg-ro
    secretPath: csg/sam-oidc              # Path in OpenBao for OIDC client + Flask session key
    clientIdKey: client_id                # OIDC client ID (Microsoft Entra app registration)
    clientSecretKey: client_secret
    issuerKey: issuer                     # OIDC issuer URL (e.g. https://login.microsoftonline.com/{tenant}/v2.0)
    flaskSecretKeyKey: flask_secret_key   # Per-environment Flask session signing key (32-byte hex)

# Scheduled tasks
# ONE CronJob for all tasks. Each task's schedule lives in
# src/scheduling/tasks/ as a Python declaration; this block only controls how
# often the dispatcher wakes up. The `task_run` ledger makes a late or
# duplicate dispatch a no-op, so the cron string here is arbitrary and adding
# a task is a code change, not a chart change.
#
# Design + rationale: docs/plans/implemented/SCHEDULED_TASKS.md § 8.
tasks:
  enabled: true
  name: samuel-tasks
  suspend: false
  # Offset from :00 to dodge the top-of-hour herd, and disjoint from the
  # collectors' */5. The exact minute is arbitrary — the ledger keys off each
  # TASK's schedule, not this one.
  schedule: "7 * * * *"
  # Etc/UTC so the controller never sees a DST gap or fold. Requires k8s ≥1.25
  # (GA 1.27); nwc1 is on 1.35.6, verified 2026-08-12. Set to "" to drop the
  # field on an older cluster.
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  # Failures are worth keeping longer than successes. Both small, matching the
  # chart's revisionHistoryLimit instinct about ArgoCD clutter.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  backoffLimit: 0
  activeDeadlineSeconds: 3000             # 50 min — strictly under the interval
  # Appended after `sam-admin --format json tasks`.
  args: ["--run-due"]
  resources:
    requests:
      memory: 256Mi                       # floor is Python import overhead
      cpu: 100m
    limits:
      memory: 1Gi                         # absorbs a surprise
      cpu: 1
  env:
    # One year. The status dashboards support long lookback, and a year-wide
    # cutoff also means the first production run is not a multi-year DELETE.
    # The default lives in src/system_status/retention.py; this overrides it.
    STATUS_RETENTION_DAYS: "365"
    # expiration_notices
    # Runaway guard: the task fails BEFORE sending anything if its audience
    # exceeds this. ~4.7x the measured peak of 535 (2026-11-23, catching the
    # Dec 31 cluster) — far enough above normal operation never to fire,
    # close enough to catch an order-of-magnitude selection bug. The default
    # lives in src/scheduling/tasks/expiration_notices.py; this pins it
    # visibly, because the number is a policy decision rather than a
    # code one.
    #
    # WARNING: NOT 250, which SCHEDULED_TASKS.md § 12 proposed. That is *below*
    # observed volume and would have failed every loaded run.
    SAM_TASKS_EMAIL_MAX: "2500"
    # One summary email per run, whatever the outcome — including the ~40
    # weeks a year that legitimately send nothing, because "no summary"
    # would otherwise mean both "nothing was due" and "the task never ran".
    # Unset it to turn the summary off; the notices themselves are unaffected.
    SAM_TASKS_SUMMARY_TO: "benkirk@ucar.edu"
    # xras_notices
    # Runaway guard for the hourly XRAS handoff notices, sized to THAT task
    # rather than shared with SAM_TASKS_EMAIL_MAX above: a normal hour sends
    # single digits, so 50 is far enough above normal operation never to fire
    # and close enough that an inverted predicate trips it on the first run
    # instead of mailing a fortnight of history. The default lives in
    # src/scheduling/tasks/xras_notices.py; this pins it visibly, because the
    # number is a policy decision rather than a code one.
    SAM_TASKS_XRAS_MAX: "50"
    # xras_sweep budgets. Both are BOUNDS, not targets: the task reports
    # `budget_exhausted` in its ledger detail when a cap actually bit, so a cap
    # that starts truncating is visible rather than reading as full coverage.
    # 25 pages x 200 requests is comfortably the whole NCAR process today.
    SAM_TASKS_XRAS_SWEEP_MAX_PAGES: "25"
    SAM_TASKS_XRAS_SWEEP_MAX_PEOPLE: "250"
    # WARNING: The window is what makes the sweep's output a QUEUE rather than a
    # census. Measured against the live process with no window: 4,088 Approved
    # requests -> 2,180 "accounts needed", 2,149 of them merely inactive —
    # every PI whose SAM account was deactivated when they retired or moved
    # on. Drops requests whose allocation had already ended when the window
    # opened; keeps live AND future ones, because a request starting next
    # quarter is exactly the lead time this sweep exists to buy.
    SAM_TASKS_XRAS_SWEEP_WINDOW_DAYS: "90"
    # "Approved" is the only status that produces a handoff. Widen to any of
    # the API's filter values, or "all", to survey the pipeline pre-approval.
    SAM_TASKS_XRAS_SWEEP_STATUS: "Approved"
    # Per-run cap on the sweep's ONE write — new xras_opportunity_allocation_type
    # rows. Pinned here for the same reason SAM_TASKS_XRAS_MAX above is: it is a
    # policy decision, and it was the only sweep knob the chart did not name, so
    # the cluster silently ran the code default. Reports `map_budget_exhausted`
    # when it bites, and the cap selects NEWEST first — a just-posted opportunity
    # is the case the feature exists for; a historical backfill can wait a slot.
    SAM_TASKS_XRAS_MAP_MAX: "20"
    # Comma-separated task names to skip, WITHOUT a code deploy. A staged-enable
    # control: the live set is enumerated here and the rest are named in the value
    # below until each has been reviewed on its own.
    #
    # Live:     cleanup_status_snapshots     (daily 02:15 MT, status DB only)
    #           deactivate_expired_projects  (writes inactivate_time in SAM)
    #           xras_sweep                   (reads api.xras.org; one narrow write --
    #                                         xras_opportunity_allocation_type rows,
    #                                         only where two derivations agree, never
    #                                         overwriting. Ingestion does not depend
    #                                         on this task or on api.xras.org.)
    #           expiration_notices           (mails external PIs; Mon 09:00 MT)
    # Disabled: xras_notices                 (mails external PIs)
    #
    # WARNING: this is an ENUMERATION and it is fail-OPEN. `disabled_tasks()` in
    # src/scheduling/runner.py is a case-sensitive exact match against registry
    # keys -- there is NO wildcard, `all`/`*`/`none` are names that match nothing,
    # and an unknown name is neither validated nor warned about. A task added to
    # src/scheduling/tasks/ therefore dispatches on the next hourly wake unless its
    # name is added here in the SAME change. That is what makes an image promotion
    # carrying a new task a non-event rather than a live rollout.
    #
    # A disabled task still writes a terminal `skipped` row that SETTLES its slot,
    # so re-enabling one mid-slot does not backfill: the first real run is the next
    # occurrence. The switch is checked ahead of `only`/`force`, so
    # `sam-admin tasks --run X --force` cannot override it.
    SAM_TASKS_DISABLED: "xras_notices"
